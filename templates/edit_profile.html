<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Edit Profile</h2>
    <form method="POST">
        <label>Name</label>
        <input type="text"
               name="name"
               value="{{ user.name }}"
               class="form-control">
        <br>
        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ user.email }}"
               class="form-control">
        <br>
        <label>New Password (optional)</label>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Leave blank to keep current password">
        <br>
        <button type="submit"
                class="btn btn-primary">
            Update Profile
        </button>
    </form>
</div>
</body>
</html>
