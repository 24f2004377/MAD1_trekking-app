<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treks Available</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<h2>All Treks</h2>
<a href="/logout" class="btn btn-danger">Logout</a>

<div class="container text-center">
  <div class="row row-cols-3 row-cols-md-3 g-4 ">
    

{% for trek in treks %}
<div class="card" style="align-items:left;" >
  <div class="col" style="align-items:left">

    <div class="card-body">
      <img src="{{ url_for('static' , filename=trek.image) }}" class="card-img-top" alt="This is a trek">
      <h5 class="card-title">Name of the trek: {{ trek.name }}</h5>
      <p class="card-text"><b>Location of the trek: </b>{{ trek.location }}</p>
      <p class="card-text"><b>Duration of the trek: </b>{{ trek.duration }}</p>
      <p class="card-text"><b>Difficulty level of the trek: </b>{{ trek.difficulty }}</p>
      <p class="card-text"><b>Details about the trek: </b>{{ trek.trek_details }}</p>
      <a href="/delete_trek/{{ trek.id }}"class="btn btn-danger">Delete</a>
      <a href="/edit_trek/{{ trek.id }}"class="btn btn-primary">Edit</a>
    </div>
  </div>
</div>
  {% endfor %}
</div>
</div>

</body>
</html>
