<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Trek Details</title>
</head>
<body>
<div style=" max-width:800px;
    width:90%;
    margin:30px auto;
    padding:30px;
    background:white;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(2, 165, 224, 0.74);">
<h2>Create Trek</h2><br>
<form method="POST" enctype="multipart/form-data">
       <label>Assign Staff</label>
       <select name="assigned_staff_id" required class="form-select" aria-label="Default select example">   
       {% for staff in staff_members %}
       <option value="{{ staff.id }}">{{ staff.name }}</option>
       {% endfor %}
       </select><br>

    <input type="text"
           name="name" required
           class="form-control"
           placeholder="Trek Name"><br>    
    <input type="text"
           name="location"
           class="form-control"
           placeholder="Location"><br>


    <input type="text"
           name="duration" required
           class="form-control"
           placeholder="duration"><br>


    <input type="number"
           name="available_slots" required
           class="form-control"
           placeholder="Available slots"><br>


    <select name="difficulty" required class="form-control">
       <option value="">Select Difficulty</option>
       <option value="Easy">Easy</option>
       <option value="Medium">Medium</option>
       <option value="Hard">Hard</option>
       </select><br>

    <input type="date"
           name="start_date" required
           class="form-control"
           placeholder="start_date"><br>
    
    <input type="date"
           name="end_date" required
           class="form-control"
           placeholder="end_date"><br>
       <div class="mb-3">
       <label for="formFileSm" class="form-label">Enter Image for the trek</label>
       <input type="file"
              name="image"
              class="class=form-control form-control-sm" id="formFileSm" type="file"
              accept="image/*">
           </div>

    <input type="text"
           name="trek_details" required
           class="form-control"
           placeholder="trek_details">

    <button class="btn btn-dark" type="submit">
        Create Trek
    </button>

</form>
</div>

</body>
</html>
