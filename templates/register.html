<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Register</title>
</head>

<body>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
    <nav class="navbar navbar-expand-lg navbar-light bg-dark" style="margin-right: auto;">
        
    <div class="container-fluid" style="margin-right: 20px;">
        <a class="navbar-brand" href="#" style="color: white;">My Trek app</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav" style="margin-right: 20px;">
        <ul class="navbar-nav">
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#" style="color: white;">Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#" style="color: white;">Contact us</a>
            </li>
            
        </ul>
        <a href="/login" class="btn btn-success" style="margin-left: 800px;">Login</a>
        <a href="/register" class="btn btn-success" style="margin-left: 20px;">SignUp</a>
        <a href="/logout"class="btn btn-danger" style="margin-left: 20px;">Logout</a>
        
        </div>
        
    </div>
    
    </nav>


    <div class="center-box">
    <h2>Register</h2>
        
    <h1>User Registration</h1>
    <form method="POST">
        <label style="font-weight: 500; font-size: larger;">What's your role?</label>
       <select name="role" class="form-select" aria-label="Default select example">   
        <option value="staff">Staff</option>
        <option value="user">User</option>
       </select><br>
        <input type="text" name="name" placeholder="Enter Name">
        <br><br>
        <input type="email" name="email" placeholder="Enter Email">
        <br><br>
        <input type="password" name="password" placeholder="Enter Password">
        <br><br>
        <button type="submit">Register</button>
    </form>

</body>

</html>
