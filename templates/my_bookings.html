<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>My Bookings</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark" style="margin-right: auto;">
        
    <div class="container-fluid" style="margin-right: 20px;">
        <a class="navbar-brand" href="#" style="color: white;">My Trek app</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav" style="margin-right: 20px;">
        <ul class="navbar-nav">
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/home" style="color: white;">Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#" style="color: white;">Contact us</a>
            </li>
            
        </ul>
        <a href="/logout" class="btn btn-danger" style="margin-left: 900px;">Logout</a>      
        </div>
        
    </div>
    
    </nav>
    <h1>My Bookings</h1>
    <a href="/user_dashboard" class="btn btn-primary" style="margin: 10px;">Back to Dashboard</a>
<hr>
<div class="container text-center">
  <div class="row row-cols-3 row-cols-md-3 g-4 ">


{% for item in booking_data %}
<div class="card" style="align-items:left;" >
  <div class="col" style="align-items:left">

<h3>{{ item.trek.name }}</h3>

<p>Location: {{ item.trek.location }}</p>

<p>Status: {{ item.booking.Status }}</p>

<p>Booking Date: {{ item.booking.Booking_Date }}</p>
<a href="/cancel_booking/{{ item.booking.Booking_ID }}"
   class="btn btn-danger">
   Cancel Booking
</a><br></div></div>
{% endfor %}

</div>
</div>


</body>
</html>
