<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
<h2>Pending Staff Requests</h2>
<div class="container">
  <div class="row">
    <div class="col">
      Name
    </div>
    <div class="col">
      Email
    </div>
    <div class="col">
      Action
    </div>
  </div>
</div>
    
    {% for staff in staff_users %}
    <div class="container">
  <div class="row">
    <div class="col">
      {{ staff.name }}
    </div>
    <div class="col">
      {{ staff.email }}
    </div>
    <div class="col">
        <a href="/approve_staff/{{ staff.id }}" class="btn btn-success">Approve</a>
        <a href="/reject-staff/{{ staff.id }}"class="btn btn-danger">Reject</a>
    </div>
  </div>
</div>
    
    {% endfor %}

</body>
</html>
